<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fff8ef">
  <title>NU八德金和店｜小小廚師營</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:"Microsoft JhengHei",sans-serif;background:radial-gradient(circle at top,#fffdf8,#fff8ef 48%,#fbeedc);color:#38291f}
    main{max-width:760px;margin:auto;padding:24px 16px 48px}
    header{text-align:center;padding:8px 0 12px}
    h1{color:#b7442e;margin:8px 0}
    header p{color:#c2672e;font-weight:700;margin:6px 0}
    section{background:#fff;margin:16px 0;padding:18px;border-radius:18px;box-shadow:0 8px 24px #6b3e1f18}
    h2{font-size:19px;color:#a94431;margin:0 0 12px}
    .o{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    label{position:relative}
    input{position:absolute;opacity:0;pointer-events:none}
    label span{display:flex;min-height:48px;align-items:center;justify-content:center;border:1.5px solid #ead9ca;border-radius:12px;font-weight:700;background:#fff;color:#38291f;cursor:pointer;transition:.16s ease}
    label span:hover{border-color:#d9b7a8;background:#fffaf7}
    input:checked+span{background:#c9553d!important;color:#fff!important;border-color:#c9553d!important;box-shadow:0 4px 12px #c9553d33}
    button{width:100%;border:0;border-radius:15px;padding:15px;background:linear-gradient(135deg,#e67e22,#ca542f);color:#fff;font-size:18px;font-weight:900;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}
    #status{text-align:center;color:#8b7769;margin:10px 0}
    #result{display:none;text-align:center}
    #photoWrap{margin-top:10px}
    #photo{width:100%;max-width:640px;aspect-ratio:4/3;object-fit:cover;border-radius:14px;box-shadow:0 10px 26px rgba(0,0,0,.12);background:#f4eadf}
    small{display:block;text-align:center;color:#8b7769;margin-top:16px}
    .desc{margin-top:8px;color:#72594b;font-size:15px}
    @media(min-width:560px){.o{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body>
<main>
  <header>
    <div style="font-size:52px">🍝</div>
    <h1>NU八德金和店</h1>
    <p>小小廚師營・客製化餐點</p>
    <p style="font-weight:500;color:#8b7769">選擇麵體與醬汁，看看你的專屬義大利麵！</p>
  </header>

  <section>
    <h2>1. 選擇麵條種類</h2>
    <div class="o">
      <label><input type="radio" name="n" value="筆管麵"><span>筆管麵</span></label>
      <label><input type="radio" name="n" value="直麵"><span>直麵</span></label>
      <label><input type="radio" name="n" value="蝴蝶麵"><span>蝴蝶麵</span></label>
      <label><input type="radio" name="n" value="螺旋麵"><span>螺旋麵</span></label>
      <label><input type="radio" name="n" value="貝殼麵"><span>貝殼麵</span></label>
      <label><input type="radio" name="n" value="麵疙瘩"><span>麵疙瘩</span></label>
    </div>
  </section>

  <section>
    <h2>2. 選擇靈魂醬汁</h2>
    <div class="o">
      <label><input type="radio" name="s" value="白醬"><span>招牌白醬</span></label>
      <label><input type="radio" name="s" value="紅醬"><span>番茄紅醬</span></label>
      <label><input type="radio" name="s" value="青醬"><span>羅勒青醬</span></label>
      <label><input type="radio" name="s" value="肉醬"><span>波隆那肉醬</span></label>
    </div>
  </section>

  <div id="status">請先選擇麵體與醬汁</div>
  <button id="cookBtn" disabled>✨ 請先選擇麵體與醬汁</button>

  <section id="result">
    <h2 id="title"></h2>
    <div class="desc" id="desc"></div>
    <div id="photoWrap"><img id="photo" alt="義大利麵照片"></div>
  </section>

  <small>6 種麵體 × 4 種醬汁，共 24 種餐點組合｜高畫質原圖版本</small>
</main>
<script>
  const btn = document.getElementById('cookBtn');
  const statusEl = document.getElementById('status');
  const titleEl = document.getElementById('title');
  const descEl = document.getElementById('desc');
  const photoEl = document.getElementById('photo');
  const resultEl = document.getElementById('result');

  function refreshButton(){
    const n = document.querySelector('[name=n]:checked');
    const s = document.querySelector('[name=s]:checked');
    const ready = !!(n && s);
    btn.disabled = !ready;
    btn.textContent = ready ? '✨ 送出餐點，產生真實照片！' : '✨ 請先選擇麵體與醬汁';
    statusEl.textContent = ready ? '已選好組合，可以產生照片' : '請先選擇麵體與醬汁';
  }

  document.querySelectorAll('input[name=n],input[name=s]').forEach(el=>{
    el.addEventListener('change', refreshButton);
  });

  btn.addEventListener('click', ()=>{
    const n = document.querySelector('[name=n]:checked')?.value;
    const s = document.querySelector('[name=s]:checked')?.value;
    if(!n || !s) return;
    const file = `images/${s}${n}.jpg`;
    photoEl.src = file;
    photoEl.onload = ()=>{ statusEl.textContent = '餐點照片載入完成'; };
    photoEl.onerror = ()=>{ statusEl.textContent = '照片載入失敗，請檢查圖片檔案'; };
    const sauceName = { '白醬':'招牌白醬', '紅醬':'番茄紅醬', '青醬':'羅勒青醬', '肉醬':'波隆那肉醬' };
    titleEl.textContent = `🎉 特製美味：${sauceName[s]}${n}`;
    descEl.textContent = `現煮 ${n}，搭配 ${sauceName[s]}。`;
    resultEl.style.display = 'block';
    resultEl.scrollIntoView({behavior:'smooth'});
  });
</script>
</body>
</html>
