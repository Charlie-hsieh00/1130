<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8ef"><title>NU八德金和店｜小小廚師營</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:"Microsoft JhengHei",sans-serif;background:radial-gradient(circle at top,#fffdf8,#fff8ef 48%,#fbeedc);color:#38291f}main{max-width:680px;margin:auto;padding:24px 16px 48px}header{text-align:center;padding:12px}h1{color:#b7442e;margin:8px 0}header p{color:#c2672e;font-weight:700}section{background:#fff;margin:16px 0;padding:18px;border-radius:18px;box-shadow:0 8px 24px #6b3e1f18}h2{font-size:19px;color:#a94431}.o{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}label{position:relative}input{position:absolute;opacity:0;pointer-events:none}label span{display:flex;min-height:46px;align-items:center;justify-content:center;border:1.5px solid #ead9ca;border-radius:12px;font-weight:700;background:#fff;color:#38291f;cursor:pointer;transition:.16s ease}label span:hover{border-color:#d9b7a8;background:#fffaf7}input:checked+span{background:#c9553d!important;color:#fff!important;border-color:#c9553d!important;box-shadow:0 4px 12px #c9553d33}button{width:100%;border:0;border-radius:15px;padding:15px;background:linear-gradient(135deg,#e67e22,#ca542f);color:#fff;font-size:18px;font-weight:900;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}#status{text-align:center;color:#8b7769;margin:10px 0}#r{display:none;text-align:center}#pic{width:100%;aspect-ratio:35/22;border-radius:14px;background-repeat:no-repeat;background-size:400% 600%;box-shadow:inset 0 0 0 1px #00000010;background-color:#f4eadf}small{display:block;text-align:center;color:#8b7769;margin-top:16px}@media(min-width:560px){.o{grid-template-columns:repeat(3,1fr)}}</style></head><body><main><header><div style="font-size:52px">🍝</div><h1>NU八德金和店</h1><p>小小廚師營・客製化餐點</p></header><section><h2>1. 選擇麵條種類</h2><div class=o><label><input type=radio name=n value="筆管麵"><span>筆管麵</span></label><label><input type=radio name=n value="直麵"><span>直麵</span></label><label><input type=radio name=n value="蝴蝶麵"><span>蝴蝶麵</span></label><label><input type=radio name=n value="螺旋麵"><span>螺旋麵</span></label><label><input type=radio name=n value="貝殼麵"><span>貝殼麵</span></label><label><input type=radio name=n value="麵疙瘩"><span>麵疙瘩</span></label></div></section><section><h2>2. 選擇靈魂醬汁</h2><div class=o><label><input type=radio name=s value="招牌白醬"><span>招牌白醬</span></label><label><input type=radio name=s value="番茄紅醬"><span>番茄紅醬</span></label><label><input type=radio name=s value="羅勒青醬"><span>羅勒青醬</span></label><label><input type=radio name=s value="波隆那肉醬"><span>波隆那肉醬</span></label></div></section><div id=status>正在載入餐點照片…</div><button id=cookBtn onclick="cook()" disabled>✨ 請先選擇麵體與醬汁</button><section id=r><h2 id=t></h2><p id=d></p><div id=pic role=img aria-label="餐點照片"></div></section><small>6 種麵體 × 4 種醬汁，共 24 種餐點組合</small></main><script>const N=["筆管麵","直麵","蝴蝶麵","螺旋麵","貝殼麵","麵疙瘩"],S=["招牌白醬","番茄紅醬","羅勒青醬","波隆那肉醬"],C=7;let photosReady=false;const btn=document.getElementById('cookBtn');function refreshButton(){const n=document.querySelector('[name=n]:checked'),s=document.querySelector('[name=s]:checked');btn.disabled=!(photosReady&&n&&s);btn.textContent=btn.disabled?'✨ 請先選擇麵體與醬汁':'✨ 送出餐點，產生真實照片！'}document.querySelectorAll('input[name=n],input[name=s]').forEach(el=>el.addEventListener('change',refreshButton));Promise.all(Array.from({length:C},(_,i)=>fetch('sprite_'+i+'.txt').then(r=>{if(!r.ok)throw Error(r.status);return r.text()}))).then(a=>{pic.style.backgroundImage='url(data:image/webp;base64,'+a.join('')+')';status.textContent='餐點照片載入完成';photosReady=true;refreshButton()}).catch(()=>{status.textContent='照片載入失敗，請重新整理頁面';photosReady=false;refreshButton()});function cook(){const ne=document.querySelector('[name=n]:checked'),se=document.querySelector('[name=s]:checked');if(!ne||!se||!photosReady)return;let n=ne.value,s=se.value,r=N.indexOf(n),c=S.indexOf(s);t.textContent='🎉 特製美味：'+s+n;d.textContent='現煮 '+n+'，搭配 '+s+'。';pic.style.backgroundPosition=c*100/3+'% '+r*100/5+'%';let o=document.getElementById('r');o.style.display='block';o.scrollIntoView({behavior:'smooth'})}</script></body></html>
